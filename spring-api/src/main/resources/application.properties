server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://bench-db:5432/bench}
spring.datasource.username=postgres
spring.datasource.password=bench
# Go tarafındaki pgxpool ile aynı havuz boyutu
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20

spring.main.banner-mode=off
spring.jmx.enabled=false
logging.level.root=WARN
# JVM'in kendi bildirdiği başlangıç süresini görebilmek için
logging.level.org.springframework.boot.StartupInfoLogger=INFO
